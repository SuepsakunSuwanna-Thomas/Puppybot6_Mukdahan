[platformio]
default_envs = adafruit_metro_rp2350

[env:adafruit_metro_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_metro_rp2350
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_extra_dirs = ../lib

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_extra_dirs = ../lib

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_extra_dirs = ../lib
